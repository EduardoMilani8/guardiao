<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guarnição</title>
<link rel="icon" href="/estatico/arte/emblema.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estatico/estilo.css">
<link rel="stylesheet" href="/estatico/personagens.css">
<link rel="stylesheet" href="/estatico/abas.css">
</head>
<body>
<!-- Definições que os quatro retratos usam (moldura e arco); o app.js põe aqui.
     Sem "hidden": dentro de display:none o navegador ignora o recorte em arco
     e o fundo de cada retrato aparece quadrado. O SVG já tem tamanho zero. -->
<div id="arte-comum" aria-hidden="true"></div>

<!-- Uma barra só, no mesmo lugar nas três telas; as cenas ficam inteiras embaixo dela. -->
<header class="gn-barra">
<div class="gn-barra-miolo">
<a class="gn-marca" href="#painel"><img src="/estatico/arte/emblema.svg" alt="" width="40" height="40">Guarnição</a>
<nav class="gn-nav" aria-label="Seções"><a href="#painel" aria-current="page">Painel</a><a href="#historico">Histórico</a><a href="#quarentena">Quarentena</a></nav>
</div>
</header>

<div class="mu-raiz" id="muralha">
<div class="mu-ceu" aria-hidden="true"></div>
<div class="mu-horizonte" id="horizonte" aria-hidden="true"></div>
<div class="mu-horizonte mu-ameaca-pulsa" id="horizonte-fogo" aria-hidden="true" hidden
     style="background: radial-gradient(ellipse 50% 60% at 92% 100%, rgba(255,90,50,.4), transparent 70%)"></div>
<svg class="mu-estrelas" id="estrelas" viewBox="0 0 1280 470" preserveAspectRatio="none" aria-hidden="true"></svg>
<div class="mu-lua" id="lua" aria-hidden="true"></div>
<div class="mu-nuvem" aria-hidden="true"></div><div class="mu-nuvem mu-nuvem2" aria-hidden="true"></div>
<svg class="mu-morros" viewBox="0 0 1280 170" preserveAspectRatio="none" aria-hidden="true">
<path d="M0 90 C120 50 220 70 330 40 C450 10 560 60 680 45 C800 30 900 70 1010 50 C1120 32 1200 60 1280 50 V170 H0 Z" fill="#0d1830"></path>
<path d="M0 120 C140 90 260 110 380 95 C520 78 640 112 780 98 C920 84 1040 110 1160 96 C1220 90 1260 96 1280 100 V170 H0 Z" fill="#09111f"></path>
</svg>

<div class="mu-torre" aria-hidden="true">
<div class="mu-torre-corpo"></div>
<div class="mu-janela"></div>
<div class="mu-mastro"></div>
<div class="mu-bandeira" id="bandeira">
<svg viewBox="0 0 92 58" preserveAspectRatio="none"><path d="M0 4 H92 V54 H0 L12 29 Z" fill="#14203A" stroke="#D4AF6A" stroke-width="2.5"></path><path d="M6 8 H88 V50 H6" fill="none" stroke="#D4AF6A" stroke-width="0.8" opacity=".6"></path></svg>
<div class="mu-bandeira-emb"><img src="/estatico/arte/emblema.svg" alt=""></div>
</div>
<div class="mu-braseiro">
<div id="braseiro"></div>
<svg viewBox="0 0 52 30" style="position: absolute; inset: 0"><path d="M2 8 H50 L44 22 H8 Z" fill="#2a2d36" stroke="#0a0c12" stroke-width="1.5"></path><path d="M20 22 L18 30 M32 22 L34 30" stroke="#2a2d36" stroke-width="3"></path></svg>
</div>
</div>

<div class="mu-rolagem">
<div class="mu-miolo">
<section class="mu-estado" aria-labelledby="titulo" aria-live="polite">
<h1 id="titulo" class="mu-titulo">Guarnição</h1>
<dl class="mu-resumo" id="resumo"></dl>
<div class="mu-progresso" id="progresso" hidden>
<div class="mu-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Andamento da varredura" id="barra"><div></div></div>
<div class="mu-arquivo">Arquivo atual <span id="arquivo-atual"></span></div>
</div>
</section>
</div>

<section class="mu-ameias" id="ameias" aria-label="Os quatro guardiões"></section>

<div class="mu-muro">
<div class="mu-placas" id="placas"></div>
<div class="mu-miolo2">
<section class="mu-acoes" id="acoes" aria-label="Ações"></section>
<div id="alertas"></div>
<div class="mu-dupla">
<section class="mu-painel" aria-labelledby="fundo-titulo"><h2 id="fundo-titulo">Em segundo plano</h2><div id="fundo"></div></section>
<section class="mu-painel" aria-labelledby="ultimas-titulo">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><h2 id="ultimas-titulo">Últimas varreduras</h2><a class="mu-link" href="#historico">Ver histórico</a></div>
<div id="ultimas"></div>
</section>
</div>
</div>
</div>
</div>
</div>

<!-- Aba Histórico: o registro em pergaminho. -->
<div class="hp-mesa" id="pergaminho" hidden>
<div id="arte-pergaminho"></div>
<div class="hp-livro">
<div class="hp-rolo" aria-hidden="true"><svg class="hp-ponta" viewBox="0 0 52 60" preserveAspectRatio="xMidYMid meet"><use href="#hpPonta"></use></svg><div class="hp-cilindro"></div><svg class="hp-ponta hp-ponta-dir" viewBox="0 0 52 60" preserveAspectRatio="xMidYMid meet"><use href="#hpPonta"></use></svg></div>
<div class="hp-area">
<div class="hp-papel">
<div class="hp-fundo" aria-hidden="true"></div>
<div class="hp-rolagem" tabindex="0" aria-label="Registro de varreduras">
<div class="hp-conteudo">
<svg class="hp-filete" viewBox="0 0 420 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M10 11 H168 M252 11 H410"></path><path d="M168 11 C180 2 192 3 194 11 C196 18 187 19 186 13"></path><path d="M252 11 C240 2 228 3 226 11 C224 18 233 19 234 13"></path></g><path d="M210 3 L218 11 L210 19 L202 11 Z" fill="#8a1e10"></path></svg>
<h1 class="hp-titulo"><span class="hp-capitular">H</span>istórico de varreduras</h1>
<p class="hp-sub">Tudo o que a Guarnição vigiou, anotado dia a dia.</p>
<dl class="hp-resumo" id="hp-resumo"></dl>
<div id="hp-registro"></div>
</div>
</div>
</div>
<div class="hp-rolo hp-rolo-baixo" aria-hidden="true"><svg class="hp-ponta" viewBox="0 0 52 60" preserveAspectRatio="xMidYMid meet"><use href="#hpPonta"></use></svg><div class="hp-cilindro"></div><svg class="hp-ponta hp-ponta-dir" viewBox="0 0 52 60" preserveAspectRatio="xMidYMid meet"><use href="#hpPonta"></use></svg></div>
</div>
<div style="height: 30px; flex: none"></div>
</div>
</div>

<!-- Aba Quarentena: a cela do Carcereiro. -->
<div class="cq-cela" id="cela" hidden>
<div id="cela-cena" style="display: contents"></div>
<div class="cq-miolo">
<h1 class="cq-titulo">Quarentena</h1>
<p class="cq-sub">Os arquivos trancados ficam aqui, presos. Daqui eles não abrem nem rodam.</p>
<dl class="cq-giz" id="cq-giz"></dl>
<div id="cq-lista"></div>
</div>
<div id="cq-modal"></div>
</div>

<div class="mu-recado" id="recado" role="status" hidden></div>
<script src="/estatico/app.js"></script>
</body>
</html>
